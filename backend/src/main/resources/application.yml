spring:
  application:
    name: hospital-inpatient
  datasource:
    url: ${HOSPITAL_DB_URL:jdbc:mysql://localhost:3306/hospital_inpatient?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowMultiQueries=true}
    username: ${HOSPITAL_DB_USERNAME:hospital_app}
    password: ${HOSPITAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

server:
  port: 8080

hospital:
  jwt:
    secret: ${HOSPITAL_JWT_SECRET}
    expiration-minutes: 120
  bootstrap:
    admin-password: ${HOSPITAL_BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origin: ${HOSPITAL_FRONTEND_ORIGIN:http://localhost:5173}
  account:
    alert-threshold: 0.00

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.hospital.inpatient: INFO
